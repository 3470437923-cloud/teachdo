<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<title>师作 TeachDo B01</title>
<link rel="stylesheet" href="teachdo.css">
</head>
<body>

<div class="app">

  <header class="titlebar">
    <div class="brand"><div class="brand-mark">师</div>师作 TeachDo <span class="brand-sub">教师备课工作台</span></div>
    <div class="tb-right">
      <button class="tb-btn" id="btn-theme" title="切换浅色 / 深色">◐</button>
      <button class="tb-btn" id="btn-save" title="保存项目 (Ctrl+S)">💾</button>
      <button class="tb-btn" id="btn-open" title="打开项目">📂</button>
      <button class="tb-btn" id="btn-settings" title="设置">⚙</button>
    </div>
  </header>

  <!-- 步骤签 -->
  <div class="steps-bar" id="stepsBar"></div>

  <div class="main">

    <!-- 主区 -->
    <section class="pane pane-main">
      <div class="runner" id="runner" style="display:none"></div>
      <div class="pane-body" id="viewBody"></div>
      <div class="actionbar" id="actionBar"></div>
    </section>

    <!-- 右栏 -->
    <aside class="pane pane-side" id="sidePane">
      <div class="pane-head" id="sideTitle">面板 <span class="sp"></span><button class="btn-quiet btn-sm" id="sideClose">✕</button></div>
      <div class="pane-body" id="sideBody"></div>
    </aside>

  </div>

  <footer class="statusbar">
    <span id="stLeft">师作 TeachDo B01</span>
    <span class="grow"></span>
    <span id="stKb" class="cap">课标库 · 载入中</span>
    <span class="stamp solid" id="stStamp"><span class="stamp-line"></span><span class="stamp-label">就绪</span></span>
  </footer>
</div>

<div id="modalRoot"></div>

<script src="js/kb.js"></script>
<script src="js/catalog.js"></script>
<script src="js/majors.js"></script>
<script src="js/prompts.js"></script>
<script src="js/llm.js"></script>
<script src="js/core.js"></script>
<script src="js/export.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
